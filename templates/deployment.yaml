apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pedalroute.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pedalroute.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pedalroute.labels" . | nindent 8 }}
      annotations:
        checksum/app: {{ .Files.Get "app.py" | sha256sum }}
    spec:
      containers:
        - name: api
          image: {{ .Values.image }}
          command: ["python", "/app/app.py"]
          env:
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: CITY_GRID
              value: {{ .Values.cityGrid | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: {{ .Release.Name }}-app
